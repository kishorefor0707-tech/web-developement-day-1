<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Saran</title>
    <style>
        /* Modern, clean, and responsive design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .intro-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            font-size: 36px;
            font-weight: bold;
            line-height: 100px;
            margin: 0 auto 20px;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 8px 0;
            color: #222;
            font-size: 26px;
        }
        .subtitle {
            margin: 0 0 20px 0;
            color: #666;
            font-size: 16px;
            font-weight: 400;
        }
        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }
        .contact-info {
            text-align: left;
            margin-bottom: 25px;
        }
        .contact-item {
            margin: 10px 0;
            font-size: 15px;
        }
        .contact-item strong {
            color: #555;
            display: inline-block;
            width: 70px;
        }
        .contact-item a {
            color: #007bff;
            text-decoration: none;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
        .cta-btn {
            display: block;
            background-color: #007bff;
            color: #fff;
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .cta-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="intro-card">
        <!-- Avatar with your initial -->
        <div class="profile-avatar">S</div>
        
        <!-- Introduction Details -->
        <h1>Saran</h1>
        <p class="subtitle">Welcome to my personal profile page!</p>
        
        <p>
            Hi, I'm Saran. I value clear communication, efficiency, and building meaningful connections. Feel free to reach out to me through any of the channels below.
        </p>
        
        <hr>

        <!-- Contact Information Section -->
        <div class="contact-info">
            <div class="contact-item">
                <strong>Email:</strong> 
                <a href="mailto:saran07@gmail.com">saran07@gmail.com</a>
            </div>
            <div class="contact-item">
                <strong>Phone:</strong> 
                <a href="tel:987654321">987654321</a>
            </div>
        </div>
        
        <!-- Interactive Connect Button -->
        <a href="mailto:saran07@gmail.com" class="cta-btn">Let's Work Together</a>
    </div>

</body>
</html>
